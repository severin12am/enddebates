<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ошибки Островского — EndDebates</title>
    <meta name="description" content="Транскрипт диспута и кандидаты для ролика: ошибки Островского." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,550;9..144,650&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="desk.css" />
  </head>
  <body>
    <header>
      <div class="wrap">
        <h1 id="title">Ошибки Островского</h1>
        <p id="subtitle">Транскрипт эфира и заготовки для ролика</p>
        <p class="meta-line">
          <a href="../../index.html">EndDebates</a>
          ·
          <a href="../jesus-not-god-ru/">База стихов</a>
        </p>
      </div>
    </header>

    <main class="wrap layout">
      <aside class="panel">
        <div id="status" class="note"></div>
        <details class="chapters-box" open>
          <summary>Главы эфира</summary>
          <ul class="chapter-list" id="chapters"></ul>
        </details>
      </aside>

      <section class="panel">
        <nav class="tabs" aria-label="Разделы">
          <button type="button" data-tab="errors" aria-selected="true">Ошибки</button>
          <button type="button" data-tab="transcript">Транскрипт</button>
          <button type="button" data-tab="shape">Ролик</button>
        </nav>

        <div data-panel="errors">
          <p class="meta-line" id="errors-intro"></p>
          <div class="toolbar">
            <select id="status-filter">
              <option value="all">Все кандидаты</option>
              <option value="hard">Твёрдые</option>
              <option value="likely">Сильные</option>
              <option value="check">Сверить</option>
            </select>
          </div>
          <div id="errors"></div>
        </div>

        <div data-panel="transcript" class="hidden">
          <div class="toolbar">
            <input type="search" id="search" placeholder="Поиск: только, Троица, Коран…" />
            <button type="button" id="copy-all" class="secondary">Копировать всё</button>
          </div>
          <div class="transcript" id="transcript"></div>
        </div>

        <div data-panel="shape" class="hidden">
          <h2>Как собрать ролик</h2>
          <ol class="checklist" id="shape"></ol>
          <h2>Чеклист</h2>
          <ol class="checklist" id="checklist"></ol>
        </div>
      </section>
    </main>
    <script src="data.js"></script>
    <script src="desk.js"></script>
  </body>
</html>
